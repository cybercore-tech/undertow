[package]
name = "undertow"
version = "0.1.0"
edition = "2021"
description = "Rootkit/compromise indicator checks: pacman file integrity, world-writable sensitive paths, ld.so.preload, SUID/SGID drift, persistence-surface drift, kernel module drift"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
cybercore = "0.5"
